name: Generate profile cards

on:
  schedule:
    - cron: "17 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type-check generator
        run: npm run typecheck

      - name: Generate GitHub profile card
        env:
          DATA_SOURCE: github
          GITHUB_USERNAME: renkonmaster
          GITHUB_TOKEN: ${{ secrets.PROFILE_GITHUB_TOKEN }}
        run: npm run generate

      - name: Commit changed generated card
        run: |
          if git diff --quiet -- generated/profile-stats.svg \
            && git ls-files --error-unmatch generated/profile-stats.svg >/dev/null 2>&1; then
            echo "Generated card is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/profile-stats.svg
          git commit -m "chore: update generated profile card"
          git push
