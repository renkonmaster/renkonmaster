name: Generate profile cards

on:
  schedule:
    - cron: "17 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type-check generator
        run: npm run typecheck

      - name: Validate public GitHub token
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_GITHUB_TOKEN }}
        run: |
          node --import tsx --input-type=module <<'NODE'
          import { validateGithubToken } from './src/data/github.ts';
          try {
            await validateGithubToken(process.env.GITHUB_TOKEN ?? '');
            console.log('GitHub Viewer authentication succeeded.');
          } catch (error) {
            console.error(error.message);
            process.exitCode = 1;
          }
          NODE

      - name: Generate GitHub profile cards
        env:
          DATA_SOURCE: github
          GITHUB_USERNAME: renkonmaster
          # GraphQL user/contribution queries require a user token. Keep this
          # token public-only; the queries explicitly select public
          # repositories and skip private repositories in contribution data.
          GITHUB_TOKEN: ${{ secrets.PROFILE_GITHUB_TOKEN }}
        run: npm run generate

      - name: Commit changed generated cards
        run: |
          git add generated/*.svg
          if git diff --cached --quiet; then
            echo "Generated card is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update generated profile cards"
          git push
