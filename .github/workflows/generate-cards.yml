name: Generate profile cards

on:
  schedule:
    - cron: "17 15 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type-check generator
        run: npm run typecheck

      - name: Validate public token and generate GitHub profile cards
        env:
          DATA_SOURCE: github
          GITHUB_USERNAME: renkonmaster
          # The generator verifies a classic PAT with no OAuth scopes through
          # authenticated REST headers before starting any GraphQL aggregation.
          GITHUB_TOKEN: ${{ secrets.PROFILE_GITHUB_TOKEN }}
        run: npm run generate

      - name: Commit changed generated cards
        run: |
          git add generated/*.svg
          if git diff --cached --quiet; then
            echo "Generated card is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update generated profile cards"
          git push
